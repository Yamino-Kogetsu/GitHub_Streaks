name: Update GitHub Streak Stats

on:
  schedule:
    # 00:00 UTC+7
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: 'user=Yamino-Kogetsu&theme=tokyonight&hide_border=true&date_format=j%2Fn%5B%2FY%5D'
          path: profile/streak.svg
          token: ${{ secrets.GH_PAT }}

      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update GitHub streak stats"
          git push